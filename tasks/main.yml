# SPDX-License-Identifier: MIT-0
---
- name: Install packages
  ansible.builtin.package:
    name: "{{ item.name }}"
    state: present
  with_items:
    - name: neovim
    - name: font-jetbrains-mono-nerd-font

- name: Link config
  ansible.builtin.file:
    state: link
    src: "{{ role_path }}/files/config/"
    dest: ~/.config/nvim
